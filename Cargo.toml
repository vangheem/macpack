[package]
name = "macpack"
version = "0.5.0"
edition = "2024"
description = "Move your Mac setup to a new Mac: apps, dotfiles, SSH keys and folders, over an encrypted local connection"
license = "MIT"
repository = "https://github.com/vangheem/macpack"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
flate2 = "1"
getrandom = "0.2"
hkdf = "0.12"
mdns-sd = "0.13"
rune = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
